<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#07070a">
  <meta name="description" content="faevu — official links">

  <title>faevu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #07070a;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

      overflow-x: hidden;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .45;
      animation: float 9s ease-in-out infinite alternate;
    }

    .orb.one {
      width: 330px;
      height: 330px;
      background: #5b5bff;
      top: -170px;
      left: 50%;
      transform: translateX(-50%);
    }

    .orb.two {
      width: 260px;
      height: 260px;
      background: #7b35ff;
      right: -150px;
      top: 35%;
      animation-delay: -3s;
    }

    .orb.three {
      width: 240px;
      height: 240px;
      background: #285dff;
      left: -150px;
      bottom: 5%;
      animation-delay: -6s;
    }

    .noise {
      position: absolute;
      inset: 0;
      opacity: .035;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    @keyframes float {
      from {
        transform: translate(-50%, 0) scale(1);
      }

      to {
        transform: translate(-50%, 35px) scale(1.08);
      }
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 540px;

      margin: 0 auto;

      padding:
        70px
        18px
        35px;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile {
      text-align: center;

      margin-bottom: 34px;

      animation: appear .8s ease both;
    }

    .avatar-wrap {
      position: relative;

      width: 108px;
      height: 108px;

      margin: 0 auto 19px;
    }

    .avatar {
      width: 108px;
      height: 108px;

      border-radius: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 35px;
      font-weight: 800;

      letter-spacing: -2px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.23),
          rgba(255,255,255,.055)
        );

      border: 1px solid rgba(255,255,255,.17);

      box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.18);

      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);

      position: relative;
      overflow: hidden;
    }

    .avatar::before {
      content: "";

      position: absolute;
      width: 80px;
      height: 80px;

      border-radius: 50%;

      background: rgba(255,255,255,.10);

      filter: blur(25px);

      top: -35px;
      left: -20px;
    }

    .avatar span {
      position: relative;
      z-index: 2;
    }

    .online {
      position: absolute;

      width: 20px;
      height: 20px;

      right: -3px;
      bottom: -3px;

      border-radius: 50%;

      background: #43e87a;

      border: 4px solid #07070a;

      box-shadow:
        0 0 18px rgba(67,232,122,.65);
    }

    .name {
      font-size: 32px;
      line-height: 1;

      font-weight: 800;

      letter-spacing: -1.4px;
    }

    .username {
      margin-top: 8px;

      color: rgba(255,255,255,.46);

      font-size: 15px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      margin-top: 14px;

      padding: 7px 12px;

      border-radius: 999px;

      background: rgba(255,255,255,.055);

      border: 1px solid rgba(255,255,255,.09);

      color: rgba(255,255,255,.65);

      font-size: 12px;

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .badge-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #43e87a;

      box-shadow: 0 0 10px #43e87a;
    }

    /* =========================
       LINKS
    ========================= */

    .links {
      display: flex;
      flex-direction: column;

      gap: 13px;
    }

    .link {
      position: relative;

      min-height: 76px;

      display: flex;
      align-items: center;

      padding: 14px 16px;

      border-radius: 24px;

      color: #fff;
      text-decoration: none;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.105),
          rgba(255,255,255,.045)
        );

      border: 1px solid rgba(255,255,255,.105);

      box-shadow:
        0 15px 40px rgba(0,0,0,.22),
        inset 0 1px rgba(255,255,255,.07);

      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);

      overflow: hidden;

      transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

      animation: slideUp .65s ease both;
    }

    .link:nth-child(1) {
      animation-delay: .08s;
    }

    .link:nth-child(2) {
      animation-delay: .14s;
    }

    .link:nth-child(3) {
      animation-delay: .20s;
    }

    .link:nth-child(4) {
      animation-delay: .26s;
    }

    .link:nth-child(5) {
      animation-delay: .32s;
    }

    .link::before {
      content: "";

      position: absolute;

      width: 130px;
      height: 130px;

      border-radius: 50%;

      background: rgba(255,255,255,.08);

      filter: blur(45px);

      left: -70px;
      top: -80px;

      opacity: 0;

      transition: opacity .3s ease;
    }

    .link:hover {
      transform: translateY(-3px);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.14),
          rgba(255,255,255,.06)
        );

      border-color:
        rgba(255,255,255,.19);

      box-shadow:
        0 20px 45px rgba(0,0,0,.28),
        0 0 30px rgba(100,100,255,.08),
        inset 0 1px rgba(255,255,255,.1);
    }

    .link:hover::before {
      opacity: 1;
    }

    .link:active {
      transform: scale(.975);
    }

    /* =========================
       ICON
    ========================= */

    .icon {
      width: 48px;
      height: 48px;

      flex: 0 0 48px;

      border-radius: 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 21px;

      background:
        rgba(255,255,255,.075);

      border: 1px solid rgba(255,255,255,.075);

      box-shadow:
        inset 0 1px rgba(255,255,255,.06);
    }

    .text {
      flex: 1;

      min-width: 0;

      margin-left: 14px;
    }

    .title {
      font-size: 16px;

      font-weight: 700;

      letter-spacing: -.15px;
    }

    .subtitle {
      margin-top: 5px;

      font-size: 13px;

      color:
        rgba(255,255,255,.43);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .arrow {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color:
        rgba(255,255,255,.40);

      background:
        rgba(255,255,255,.045);

      font-size: 23px;

      transition:
        transform .25s ease,
        color .25s ease,
        background .25s ease;
    }

    .link:hover .arrow {
      transform: translateX(3px);

      color: #fff;

      background:
        rgba(255,255,255,.09);
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 30px;

      text-align: center;

      color:
        rgba(255,255,255,.24);

      font-size: 12px;

      letter-spacing: .2px;

      animation:
        appear .8s .45s ease both;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 420px) {

      .container {
        padding:
          48px
          15px
          28px;
      }

      .avatar,
      .avatar-wrap {
        width: 94px;
        height: 94px;
      }

      .avatar {
        border-radius: 30px;
      }

      .name {
        font-size: 29px;
      }

      .link {
        min-height: 70px;
        border-radius: 22px;
      }

      .icon {
        width: 45px;
        height: 45px;
        flex-basis: 45px;
      }
    }
  </style>
</head>
