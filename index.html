<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#07070a">
  <meta name="description" content="faevu — official profile and projects">

  <title>faevu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #07070a;
      --glass: rgba(255,255,255,.075);
      --glass-hover: rgba(255,255,255,.115);
      --border: rgba(255,255,255,.11);
      --text: #ffffff;
      --muted: rgba(255,255,255,.48);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% -12%,
          rgba(105,105,255,.25),
          transparent 38%
        ),
        radial-gradient(
          circle at 100% 45%,
          rgba(120,55,255,.12),
          transparent 30%
        ),
        radial-gradient(
          circle at 0% 85%,
          rgba(50,100,255,.10),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

      overflow-x: hidden;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;

      pointer-events: none;

      overflow: hidden;

      z-index: 0;
    }

    .glow {
      position: absolute;

      width: 330px;
      height: 330px;

      border-radius: 50%;

      filter: blur(100px);

      opacity: .38;

      animation:
        floating 10s ease-in-out infinite alternate;
    }

    .glow-1 {
      background: #5f5fff;

      top: -170px;
      left: 50%;

      transform: translateX(-50%);
    }

    .glow-2 {
      background: #7b35ff;

      width: 260px;
      height: 260px;

      right: -150px;
      top: 38%;

      animation-delay: -3s;
    }

    .glow-3 {
      background: #2865ff;

      width: 240px;
      height: 240px;

      left: -150px;
      bottom: 5%;

      animation-delay: -6s;
    }

    @keyframes floating {
      from {
        transform: translateY(0) scale(1);
      }

      to {
        transform: translateY(35px) scale(1.08);
      }
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      position: relative;

      z-index: 2;

      width: 100%;
      max-width: 560px;

      margin: 0 auto;

      padding:
        65px
        18px
        35px;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile {
      text-align: center;

      margin-bottom: 38px;

      animation:
        fadeUp .8s ease both;
    }

    .avatar-wrapper {
      position: relative;

      width: 108px;
      height: 108px;

      margin: 0 auto 19px;
    }

    .avatar {
      width: 108px;
      height: 108px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 34px;

      font-size: 36px;
      font-weight: 850;

      letter-spacing: -2px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.22),
          rgba(255,255,255,.045)
        );

      border:
        1px solid rgba(255,255,255,.17);

      box-shadow:
        0 25px 75px rgba(0,0,0,.48),
        inset 0 1px rgba(255,255,255,.18);

      backdrop-filter:
        blur(30px);

      -webkit-backdrop-filter:
        blur(30px);

      overflow: hidden;
    }

    .avatar::before {
      content: "";

      position: absolute;

      width: 100px;
      height: 100px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.11);

      filter: blur(30px);

      top: -50px;
      left: -35px;
    }

    .avatar span {
      position: relative;

      z-index: 2;
    }

    .name {
      font-size: 33px;

      font-weight: 800;

      letter-spacing: -1.5px;
    }

    .username {
      margin-top: 8px;

      color: var(--muted);

      font-size: 15px;
    }

    .description {
      margin-top: 15px;

      color:
        rgba(255,255,255,.60);

      font-size: 14px;

      line-height: 1.5;
    }

    /* =========================
       SECTION
    ========================= */

    .section {
      margin-top: 31px;
    }

    .section-title {
      margin-left: 5px;
      margin-bottom: 12px;

      color:
        rgba(255,255,255,.35);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 1.6px;

      text-transform: uppercase;
    }

    /* =========================
       PROJECTS
    ========================= */

    .projects {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;
    }

    .project {
      position: relative;

      min-height: 180px;

      padding: 19px;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      color: white;

      text-decoration: none;

      border-radius: 27px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.105),
          rgba(255,255,255,.045)
        );

      border:
        1px solid var(--border);

      box-shadow:
        0 18px 45px rgba(0,0,0,.20),
        inset 0 1px rgba(255,255,255,.07);

      backdrop-filter:
        blur(28px);

      -webkit-backdrop-filter:
        blur(28px);

      overflow: hidden;

      transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

      animation:
        fadeUp .7s ease both;
    }

    .project:nth-child(2) {
      animation-delay: .08s;
    }

    .project::before {
      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      border-radius: 50%;

      background:
        rgba(110,110,255,.16);

      filter: blur(55px);

      right: -75px;
      top: -75px;

      opacity: .7;
    }

    .project:hover {
      transform:
        translateY(-5px);

      background:
        var(--glass-hover);

      border-color:
        rgba(255,255,255,.19);

      box-shadow:
        0 24px 55px rgba(0,0,0,.28),
        0 0 35px rgba(100,100,255,.08);
    }

    .project:active {
      transform:
        scale(.97);
    }

    .project-icon {
      position: relative;

      width: 50px;
      height: 50px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 17px;

      font-size: 23px;

      background:
        rgba(255,255,255,.08);

      border:
        1px solid rgba(255,255,255,.08);

      box-shadow:
        inset 0 1px rgba(255,255,255,.07);
    }

    .project-info {
      position: relative;
    }

    .project-name {
      font-size: 17px;

      font-weight: 750;

      letter-spacing: -.2px;
    }

    .project-description {
      margin-top: 5px;

      color:
        rgba(255,255,255,.43);

      font-size: 12px;
    }

    .project-arrow {
      position: absolute;

      right: 17px;
      bottom: 17px;

      width: 31px;
      height: 31px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(255,255,255,.06);

      color:
        rgba(255,255,255,.50);

      font-size: 20px;
    }

    /* =========================
       TELEGRAM LINKS
    ========================= */

    .links {
      display: flex;

      flex-direction: column;

      gap: 12px;
    }

    .link {
      position: relative;

      min-height: 73px;

      display: flex;

      align-items: center;

      padding: 13px 15px;

      color: white;

      text-decoration: none;

      border-radius: 23px;

      background:
        var(--glass);

      border:
        1px solid var(--border);

      box-shadow:
        0 14px 38px rgba(0,0,0,.18),
        inset 0 1px rgba(255,255,255,.055);

      backdrop-filter:
        blur(27px);

      -webkit-backdrop-filter:
        blur(27px);

      overflow: hidden;

      transition:
        transform .22s ease,
        background .22s ease,
        border-color .22s ease;

      animation:
        fadeUp .7s ease both;
    }

    .link:nth-child(2) {
      animation-delay: .08s;
    }

    .link:nth-child(3) {
      animation-delay: .16s;
    }

    .link:hover {
      transform:
        translateY(-3px);

      background:
        var(--glass-hover);

      border-color:
        rgba(255,255,255,.18);
    }

    .link:active {
      transform:
        scale(.98);
    }

    .link-icon {
      width: 47px;
      height: 47px;

      flex: 0 0 47px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 16px;

      background:
        rgba(255,255,255,.075);

      border:
        1px solid rgba(255,255,255,.075);

      font-size: 21px;
    }

    .link-text {
      flex: 1;

      min-width: 0;

      margin-left: 14px;
    }

    .link-title {
      font-size: 16px;

      font-weight: 700;
    }

    .link-subtitle {
      margin-top: 4px;

      color:
        rgba(255,255,255,.42);

      font-size: 13px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .link-arrow {
      width: 33px;
      height: 33px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(255,255,255,.045);

      color:
        rgba(255,255,255,.42);

      font-size: 22px;

      transition:
        transform .22s ease,
        color .22s ease;
    }

    .link:hover .link-arrow {
      transform:
        translateX(3px);

      color: white;
    }

    /* =========================
       SHARE
    ========================= */

    .share {
      width: 100%;

      min-height: 61px;

      margin-top: 25px;

      border: 1px solid var(--border);

      border-radius: 20px;

      color: white;

      font-family: inherit;

      font-size: 15px;

      font-weight: 650;

      background:
        rgba(255,255,255,.055);

      backdrop-filter:
        blur(25px);

      -webkit-backdrop-filter:
        blur(25px);

      cursor: pointer;

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .share:hover {
      background:
        rgba(255,255,255,.09);
    }

    .share:active {
      transform:
        scale(.98);
    }

    /* =========================
       QR
    ========================= */

    .qr-section {
      margin-top: 28px;

      padding: 24px;

      text-align: center;

      border-radius: 25px;

      background:
        rgba(255,255,255,.045);

      border:
        1px solid rgba(255,255,255,.075);

      backdrop-filter:
        blur(25px);

      -webkit-backdrop-filter:
        blur(25px);

      animation:
        fadeUp .8s .35s ease both;
    }

    .qr-title {
      font-size: 14px;

      font-weight: 700;
    }

    .qr-subtitle {
      margin-top: 5px;

      color:
        rgba(255,255,255,.38);

      font-size: 12px;
    }

    #qrcode {
      width: 150px;
      height: 150px;

      margin:
        18px auto 0;

      padding: 9px;

      border-radius: 19px;

      background: white;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    #qrcode img {
      width: 100%;
      height: 100%;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 30px;

      text-align: center;

      color:
        rgba(255,255,255,.22);

      font-size: 12px;

      letter-spacing: .3px;
    }

    /* =========================
       ANIMATION
    ========================= */

    @keyframes fadeUp {

      from {
        opacity: 0;

        transform:
          translateY(18px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 430px) {

      .container {
        padding:
          48px
          15px
          28px;
      }

      .avatar-wrapper {
        width: 94px;
        height: 94px;
      }

      .avatar {
        width: 94px;
        height: 94px;

        border-radius: 30px;
      }

      .name {
        font-size: 29px;
      }

      .projects {
        gap: 10px;
      }

      .project {
        min-height: 165px;

        padding: 16px;

        border-radius: 23px;
      }

      .project-name {
        font-size: 15px;
      }

      .project-description {
        font-size: 11px;
      }

      .link {
        min-height: 69px;

        border-radius: 21px;
      }

    }

    @media (max-width: 350px) {

      .project {
        min-height: 150px;
      }

      .project-icon {
        width: 44px;
        height: 44px;
      }

      .project-name {
        font-size: 14px;
      }

    }
  </style>
</head>


<body>

  <!-- BACKGROUND -->

  <div class="background">

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

  </div>


  <main class="container">


    <!-- =========================

    <!-- =========================

    <section class="section">

      </div>

      <div class="links">

        <a
          class="link"

          <div class="link-icon">

          </div>

            </div>

            </div>

          </div>

          <div class="link-arrow">

        </a>

    <!-- =========================

    <section class="section">

      <div class="section-title">

      </div>

      <div class="projects">


        <!-- SHOP -->

        <a

          </div>

    <!-- =========================
         TELEGRAM
    ========================= -->

    <section class="section">

      <div class="section-title">

      </div>

      <div class="links">


        <!-- INFO -->

        <a
          class="link"
          href="https://t.me/faevu_info"
          target="_blank"
          rel="noopener noreferrer"
        >

          <div class="link-icon">

          </div>

          <div class="link-text">

            <div class="link-title">

            </div>

            </div>

          </div>

          <div class="link-arrow">
            ›
          </div>

        </a>


        <!-- PROOFS -->

        <a
          class="link"
          href="https://t.me/faevusha_proof"
          target="_blank"
          rel="noopener noreferrer"
        >

          <div class="link-icon">
            ✅
          </div>

          <div class="link-text">

            <div class="link-title">
              Proofs
            </div>

            <div class="link-subtitle">
              @faevusha_proof
            </div>

          </div>

          <div class="link-arrow">
            ›
          </div>

        </a>


      </div>

    </section>



    <!-- =========================
         SHARE
    ========================= -->

    <button
      class="share"
      onclick="shareProfile()"
    >
      ↗ &nbsp; Поделиться профилем
    </button>



    <!-- =========================
         QR
    ========================= -->

    <section class="qr-section">

      <div class="qr-title">
        Scan me
      </div>

      <div class="qr-subtitle">
        Открой профиль с помощью QR-кода
      </div>

      <div id="qrcode"></div>

    </section>



    <!-- FOOTER -->

    <footer>
      faevu · 2026
    </footer>


  </main>



  <!-- QR LIBRARY -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


  <script>

    /* =========================
       QR CODE
    ========================= */

    new QRCode(
      document.getElementById("qrcode"),
      {
        text: window.location.href,
        width: 132,
        height: 132,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      }
    );


    /* =========================
       SHARE
    ========================= */

    async function shareProfile() {

      const shareData = {
        title: "faevu",
        text: "Official faevu profile",
        url: window.location.href
      };

      try {

        if (navigator.share) {

          await navigator.share(shareData);

        } else {

          await navigator.clipboard.writeText(
            window.location.href
          );

          alert("Ссылка скопирована!");

        }

      } catch (error) {

        console.log("Share cancelled");

      }

    }

  </script>

</body>
</html>
